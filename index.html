<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Variants Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-
    QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="global.css">
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
    <h1>Button Variants Demo</h1>

    <!-- Primary Buttons -->
    <section>
        <h2>Primary</h2>
        <button class="btn btn-primary btn-sm">Small</button>
        <button class="btn btn-primary btn-md">Medium</button>
        <button class="btn btn-primary btn-lg">Large</button>
        <button class="btn btn-primary btn-lg" disabled>Disabled</button>
        <button class="btn btn-outline-primary btn-md">Outline</button>
        <button class="btn btn-text-primary btn-md">Text</button>
    </section>

    <!-- Secondary Buttons -->
    <section>
        <h2>Secondary</h2>
        <button class="btn btn-secondary btn-sm">Small</button>
        <button class="btn btn-secondary btn-md">Medium</button>
        <button class="btn btn-secondary btn-lg">Large</button>
        <button class="btn btn-outline-secondary btn-md">Outline</button>
        <button class="btn btn-text-secondary btn-md">Text</button>
    </section>

    <!-- Danger / Error Buttons -->
    <section>
        <h2>Danger / Error</h2>
        <button class="btn btn-danger btn-sm">Small</button>
        <button class="btn btn-danger btn-md">Medium</button>
        <button class="btn btn-danger btn-lg">Large</button>
        <button class="btn btn-text-danger btn-lg">Text Danger</button>
    </section>

    <!-- Text & Typography Demo -->
    <section>
        <h2>Text & Typography</h2>
        <p class="text-primary">Primary Text</p>
        <p class="text-secondary">Secondary Text</p>
        <p class="text-danger">Danger Text</p>
        <p class="text-muted">Muted/Grey Text</p>
        <p class="font-sm">Small Text Size</p>
        <p class="font-md">Medium Text Size</p>
        <p class="font-lg">Large Text Size</p>
    </section>

    <a href="./dashboard/index.html">Go to Dashboard</a>
</body>

</html>
