<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="navbar"></div>
    <div class="container mt-4">
        <div class="d-flex justify-content-between mb-4">
            <h2>Events</h2>
            <a href="../createEvent/index.html"
                class="btn btn-tertiary d-flex align-items-center justify-content-center">+ Create Event</a>
        </div>

        <div class="row mb-3">
            <div class="col-md-4">
                <input type="text" id="searchTitle" class="form-control" placeholder="Search by title">
            </div>

            <div class="col-md-3">
                <select id="statusFilter" class="form-select">
                    <option value="">All Status</option>
                    <option value="Confirmed">Confirmed</option>
                    <option value="Draft">Draft</option>
                    <option value="Cancelled">Cancelled</option>
                </select>
            </div>

            <div class="col-md-3">
                <select id="sortOrder" class="form-select">
                    <option value="desc">Newest First</option>
                    <option value="asc">Oldest First</option>
                </select>
            </div>

            <div class="col-md-2 d-flex gap-2">
                <button id="searchBtn" class="btn btn-info w-100">Search</button>
                <button id="clearBtn" class="btn btn-text w-100">Clear</button>
            </div>
        </div>

        <!-- TABLE -->
        <div class="card p-3">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>Event</th>
                        <th>Date & Time</th>
                        <th>Organiser</th>
                        <th>Status</th>
                        <th>Capacity</th>
                        <th class="text-center">Actions</th>
                    </tr>
                </thead>
                <tbody id="eventTable"></tbody>
            </table>
        </div>

    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="../load.js"></script>
    <script src="event.js"></script>

</body>

</html>
