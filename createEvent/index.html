<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Event - EventHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="navbar"></div>
    <div class="container">
        <a href="../manageEvent/index.html" class="back-link">&larr; Back to Events</a>
        <h2 class="mb-3 text-center">Create New Event</h2>
        <form id="createEventForm">
            <div class="mb-3">
                <label for="title">Event Title</label>
                <input type="text" id="title" class="form-control" placeholder="Enter event title">
                <div id="titleError" class="error-msg"></div>
            </div>
            <div class="mb-3">
                <label for="description">Description</label>
                <textarea id="description" class="form-control" rows="3" placeholder="Describe Event"></textarea>
                <div id="descriptionError" class="error-msg"></div>
            </div>
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="startDate">Start Date & Time</label>
                    <input type="datetime-local" id="startDate" class="form-control">
                    <div id="startDateError" class="error-msg"></div>
                </div>
                <div class="col-md-6">
                    <label for="endDate">End Date & Time</label>
                    <input type="datetime-local" id="endDate" class="form-control">
                    <div id="endDateError" class="error-msg"></div>
                </div>
            </div>
            <div class="mb-3">
                <label for="location">Location</label>
                <input type="text" id="location" class="form-control" placeholder="Enter Address">
                <div id="locationError" class="error-msg"></div>
            </div>
            <div class="mb-3">
                <label for="capacity">Capacity</label>
                <input type="number" id="capacity" class="form-control" placeholder="Enter capacity">
                <div id="capacityError" class="error-msg"></div>
            </div>
            <div class="mb-3">
                <label for="price">Ticket Price ($)</label>
                <input type="number" id="price" class="form-control" placeholder="Enter Ticket Price" min="0" step="0.01">
                <div id="priceError" class="error-msg"></div>
            </div>
            <div class="mb-3">
                <label for="status">Status</label>
                <select id="status" class="form-select">
                    <option value="">— Select status —</option>
                    <option value="Confirmed">Confirmed</option>
                    <option value="Draft">Draft</option>
                    <option value="Cancelled">Cancelled</option>
                </select>
                <div id="statusError" class="error-msg"></div>
            </div>
            <div class="mb-3">
                <label>Event Image (optional)</label>
                <label class="file-input-wrapper">
                    Click or drag to upload image
                    <input type="file" id="image">
                </label>
            </div>
            <div class="d-flex gap-2">
                <button type="reset" class="btn btn-text text-white w-50">Reset Form</button>
                <button type="submit" class="btn btn-primary w-50">Create Event</button>
            </div>
        </form>
    </div>
    <script src="script.js"></script>
    <script src="../load.js"></script>

</body>

</html>
