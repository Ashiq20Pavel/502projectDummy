<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EventHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../register/style.css">
</head>

<body>
    <div class="container">
        <h2>Welcome Back</h2>
        <p class="subtitle">Sign in to your EventHub account</p>

        <form id="loginForm">

            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="jane@example.com">
                <div id="emailError" class="error-msg"></div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" class="form-control" placeholder="••••••••">
                <div id="passwordError" class="error-msg"></div>
            </div>

            <button type="submit" class="btn btn-secondary mb-3 w-100">Login</button>

            <div class="authenticate-link">
                Don't have an account? <a href="../register/index.html">Register now</a>
            </div>

        </form>
    </div>
    <script src="./script.js"></script>
</body>

</html>
