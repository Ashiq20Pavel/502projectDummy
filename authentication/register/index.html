<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - EventHub</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="d-flex flex-column justify-content-start">
            <h2>Create Account</h2>
            <p>Join EventHub to organise or attend events </p>
        </div>
        <form id="registrationForm">
            <div class="mb-3">
                <label class="form-label">Role</label><br>
                <div class="form-check form-check-inline">
                    <input type="radio" name="role" value="organiser" class="form-check-input" id="roleOrganiser">
                    <label class="form-check-label" for="roleOrganiser">Organiser</label>
                </div>
                <div class="form-check form-check-inline">
                    <input type="radio" name="role" value="attendee" class="form-check-input" id="roleAttendee">
                    <label class="form-check-label" for="roleAttendee">Attendee</label>
                </div>
                <div id="roleError" class="error-msg"></div>
            </div>
            <div class="mb-3">
                <label for="name" class="form-label">Full Name</label>
                <input type="text" id="name" class="form-control" placeholder="Your full name">
                <div id="nameError" class="error-msg"></div>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" id="email" class="form-control" placeholder="example@email.com">
                <div id="emailError" class="error-msg"></div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Enter password">
                <div id="passwordError" class="error-msg"></div>
            </div>

            <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm password">
                <div id="confirmPasswordError" class="error-msg"></div>
            </div>

            <div class="form-check mb-3">
                <input type="checkbox" id="terms" class="form-check-input">
                <label class="form-check-label" for="terms">I accept the terms and conditions</label>
                <div id="termsError" class="error-msg"></div>
            </div>

            <div class="d-flex justify-content-end gap-2">
                <button type="reset" class="btn btn-text text-white w-100" id="resetBtn">Reset</button>
                <button type="submit" class="btn btn-secondary w-100">Register</button>
            </div>

            <div class="authenticate-link">
                Already have an account? <a href="../login/index.html" class="text-decoration-underline">Login Here</a>
            </div>

        </form>
    </div>

    <script src="./script.js"></script>
</body>

</html>
